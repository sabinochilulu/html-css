<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>links</title>
    <style>
        body{
            font-family: Arial, Helvetica, sans-serif;
        }
        a{
            color: red;
             text-decoration: none;
             font-weight: bold;
        }
        a:visited{
          color: darkred;
         
        }
        a:hover{
            text-decoration: underline;
            color: black;
        }
        a:active{
            color: yellow;
        }
        a::after{
            content: '[link]';
            color: darkgray;
            text-decoration: none;
            font-weight: normal;
        }

    </style>
</head>
<body>
    <h1>Personalizando Links</h1>

<ul>
    <li><a href="https://gustavogoanabara.github.io" target="_blank">Repositorio Github</a></li>
    <li><a href="https://youtube.com/cursoemvideo">Canal do Youtub</a></li>
    <li><a href="https://www.cursoemvideo.com">Site do Curso em video</a></li>
</ul>

</body>
</html>
