<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exemplo de Hover</title>
    <style>
        body{
            font-family: Arial, Helvetica, sans-serif;
        }
        div > p{
            display: none;
        }

        DIV:HOVER > P {
            display: block;
            color: white;
            background-color: red;
            width: 300px;
        }
        div:hover{
        color: red;
        }
    </style>
</head>
<body>
    <h1>Exemplo de hover</h1>
    <p>Passe o ouse no texto abaixo</p>
    <div>
        Passe o mouse qui
    <p>TEXTO ESCONDIDO...</p>
    </div>
</body>
</html>
