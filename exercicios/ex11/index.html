<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>midias em html5</title>
</head>
<body>
    <h1>Imagens dinamicas</h1>
    <p>Tente abrir esse site em vairios dispositivos diferente ou dimplismente aumente e diminue o tamaho do seu navegador</p>

    <picture>
        <source media="(max-width:750px )" srcset="imagens/foto-p.png" type="image/png">
        <source media="(max-width:1050px )" srcset="imagens/foto-m.png" type="image/png">
        <img src="imagens/foto-g.png" alt="imagem flexivel">
    </picture>

    <h1>Reproduzindo audio</h1>

    <p>Vamos aprender a reproduzir audio em html 5.</p>
    <audio preload="metadata"autoplay controls loop>
        <source src="midia/alta mafia.mpeg" type="audio/mpeg">
        <source src="midia/alta mafia.ogg" type="odio/ogg">
        <source src="midia/alta mafia.wav" type="audio/wav">

        <p>Infelizmente seu navegador nao consegue reproduzir audio. <a href="midia/alta mafia.mpeg">clica aqui para baixar o arquivo mpeg</a></p>
    </audio>
</body>
</html>
